mod.green-fortress.name = 녹색 요새
mod.green-fortress.description = 세계는 새롭게 창조되고, 우리는 문명을 재건한다

status.green-fortress-freezing.name = 彗星の鎖
status.green-fortress-freezing.description = 셀디아의 원자력 레이저의 힘으로 다양한 상태가 반감된다
status.green-fortress-burning.name = 태양의 불꽃

block.green-fortress-seldinia-conveyor.name = 죽음의 꽃 결정의 컨베이어
block.green-fortress-seldinia-conveyor.description = 죽음의 꽃 결정의 힘을 지닌 컨베이어입니다. 대부분의 공격을 견딜 수 있으며 방어에도 사용할 수 있습니다.또한 바다 위에도 설치 가능합니다.

sector.green-fortress-Zeno.name = 재앙의 시작
sector.green-fortress-Zeno.description = 어디선가 본 듯한 풍경. 그러나 그곳에는 재앙의 전조가 조용히 찾아오고 있었다
sector.green-fortress-ZenoForest.name = 얼어붙은 숲의 깊은 곳
sector.green-fortress-ZenoForest.description = 얼어붙은 숲 깊숙한 곳에 위치한 장소입니다. 여기서 서지 합금을 연구합시다.
sector.green-fortress-SelCraters.name = 불온한 분위기에 휩싸인 전장
sector.green-fortress-SelCraters.description = 전쟁의 흔적이 남아 있는 이 땅은 장의 꽃에 지배당해 생명을 위협하는 곳이 되었습니다. 섹터를 제압하고 장의 꽃의 침공을 막아내자!
sector.green-fortress-SunDesert.name = 태양의 사막
sector.green-fortress-sunDesert.description = 불타는 듯한 빛이 내리쬐는 사막의 땅입니다. 여기에 태고의 사람들이 남긴 보물이 남아 있다고 전해집니다.
sector.green-fortress-GreenField.name = 녹색의 성역
sector.green-fortress-GreenField.description = 녹색으로 둘러싸인 자연의 성역입니다. 톡소피드의 습격에 대비하면서 적 기지를 제압합시다.
sector.green-fortress-AttackMapCity.name = 도시
sector.green-fortress-AttackMapCity.description = 이 섹터는 함정이 가득한데, 전기를 폐기하는 설비를 파괴하지 않는 것이 중요합니다. 파괴해 버리면 공략이 어려워집니다.