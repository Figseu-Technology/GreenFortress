mod.green-fortress.name = Green Fortress DELTA
mod.green-fortress.description = 世界は新たに創造され、我々は文明を再構築する

status.green-fortress-burning.name = 太陽の炎

block.green-fortress-seldinia-conveyor.name = 葬花結晶のコンベア
block.green-fortress-seldinia-conveyor.description = 葬花結晶の力を宿したコンベアです。ほとんどの攻撃に耐えることができ、防衛にも使えます。また、海の上にも設置可能です。

sector.green-fortress-Zeno.name = 厄災の始まり
sector.green-fortress-Zeno.description = どこかで見たような景色。しかしそこには厄災の予兆が静かに訪れていた
sector.green-fortress-ZenoForest.name = 凍てつく森の奥地
sector.green-fortress-ZenoForest.description = 凍った森の奥に位置する場所です。ここでサージ合金を研究しましょう
sector.green-fortress-SelCraters.name = 不穏に包まれた戦地
sector.green-fortress-SelCraters.description = 戦争の足跡が残るこの大地は、葬花に支配され生命を脅かす地になっています。エリアを制圧し、葬花の侵攻を止めましょう!
sector.green-fortress-SunDesert.name = 太陽の砂漠
sector.green-fortress-SunDesert.description = 灼熱の光が照りつける砂漠の大地です。ここに太古の人々が残したとある宝物が残されていると言われています
sector.green-fortress-GreenField.name = 緑の聖域
sector.green-fortress-GreenField.description = 緑に囲まれた自然の聖域です。トキソピッドの襲撃に備えつつ、敵基地を制圧しましょう。
sector.green-fortress-AttackMapCity.name = 都市
sector.green-fortress-AttackMapCity.description = トラップ満載のこのセクターは電源を捨てている設備を破壊しないことです。破壊してしまうと攻略が難しくなります